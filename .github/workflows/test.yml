name: test

on: 
  push:
    branches: '**'
  pull_request:

jobs:
  unit-test:
    name: "gdUnit4 Automated Test"
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 10 # overall timeout
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - uses: actions/checkout@v6
      - uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: '4.6.1'
          paths: |
            res://unit
