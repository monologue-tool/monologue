name: lint

on:
  push:

env:
  GODOT_VERSION: '4.7'

jobs:
  parse-check:
    name: "Godot parse check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "${BASE}/${GODOT_VERSION}-stable/${ZIP}"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project and fail on script errors
        run: |
          set -o pipefail
          # --import parses every script; a first run can exit non-zero while still
          # producing a usable log, so the grep below is what decides pass/fail.
          ./godot --headless --import 2>&1 | tee import.log || true
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::Script errors detected during import"
            grep -nE "SCRIPT ERROR|Parse Error|Compile Error" import.log
            exit 1
          fi

  gdtoolkit:
    name: "gdlint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install "gdtoolkit==4.*"

      - name: Collect project scripts
        id: files
        run: |
          # gdUnit4 is vendored, so it is skipped. addons/monologue is ours -- it is
          # the runtime, and it is held to the same bar as the editor.
          echo "list=$(git ls-files '*.gd' \
            | grep -v '^addons/gdUnit4/' \
            | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # No gdformat --check here on purpose. Property declarations are written one
      # option per line for readability, and gdformat collapses any chain that fits
      # on a single line, with no option to leave it alone. gdlint still enforces
      # line length, naming and dead code, which is what actually matters.
      - name: Lint
        run: gdlint ${{ steps.files.outputs.list }}
